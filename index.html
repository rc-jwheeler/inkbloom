<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ink Bloom">
<meta name="theme-color" content="#0b1118">
<title>Ink Bloom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hint">tap the water</div>
<div id="pausedPill" aria-live="polite">paused · tap to resume</div>

<button id="frameBtn" aria-label="Save as wallpaper" title="Save as wallpaper">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><rect x="7.5" y="7.5" width="9" height="9" rx="1.2"/></svg>
</button>
<button id="gear" aria-label="Settings">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
</button>

<div id="settings" class="hidden" role="dialog" aria-label="Settings">
  <div class="row"><span>Scene</span>
    <div class="seg"><button data-scene="day">Pond</button><button data-scene="night">Night</button></div>
  </div>
  <label class="row"><span>Sound</span><input type="checkbox" id="optSound"></label>
  <label class="row"><span>Ambient water</span><input type="checkbox" id="optAmbient"></label>
  <label class="row"><span>Slow mode</span><input type="checkbox" id="optSlow"></label>
</div>

<div id="wallpaper" class="hidden" role="dialog" aria-label="Save as wallpaper">
  <h2>Save as wallpaper</h2>
  <label class="row"><span>Freeze bloom</span><input type="checkbox" id="optPause"></label>
  <div class="sizes" id="sizes"></div>
  <button id="saveBtn">Save PNG</button>
  <p class="note">The picture is just the water — no buttons.</p>
</div>

<div id="preview" class="hidden" role="dialog" aria-label="Wallpaper preview">
  <img id="previewImg" alt="Ink Bloom wallpaper">
  <p id="previewMsg">Long-press the image to save it to Photos.</p>
  <button id="previewDone">Done</button>
</div>

<div id="bar">
  <div id="palette"></div>
  <button id="clearBtn" aria-label="Clear water">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0M3 15c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/></svg>
  </button>
</div>

<script src="js/audio.js"></script>
<script src="js/fluid.js"></script>
<script src="js/fallback.js"></script>
<script src="js/main.js"></script>
</body>
</html>
